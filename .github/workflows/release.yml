name: Release

# Se dispara cuando se pushea un tag v* (ej: v1.1.56)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    permissions:
      id-token: write   # requerido por SignPath para OIDC
      actions: read     # requerido por SignPath para descargar artifacts

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar dependencias del sistema (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2
          # libfuse2: linuxdeploy/appimagetool (que tauri-bundler descarga para armar
          # el AppImage) corren como AppImage y necesitan FUSE2 para montarse; Ubuntu
          # 22.04+ no lo trae instalado por default.

      - run: pnpm install

      - name: Build
        run: pnpm exec tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      # ── Solo Windows: firmar el MSI con SignPath ──────────────────────────
      # Si SIGNPATH_API_TOKEN no está configurado, el paso falla con
      # continue-on-error y el release sigue con el MSI sin firmar.

      - name: Subir MSI sin firmar (entrada para SignPath)
        id: upload-unsigned
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: msi-unsigned
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore

      - name: Firmar MSI con SignPath (Authenticode)
        id: sign
        if: matrix.name == 'windows'
        uses: SignPath/github-action-submit-signing-request@v1.1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'whatajost'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed-msi
        continue-on-error: true

      # Reemplazar el MSI sin firmar por el firmado y re-generar el .msi.sig
      # que usa el auto-updater de Tauri (la firma Authenticode modifica los
      # bytes del MSI, invalidando el .sig original).
      - name: Reemplazar MSI y re-generar firma del updater
        if: matrix.name == 'windows' && steps.sign.outcome == 'success'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          msi=$(ls src-tauri/target/release/bundle/msi/*.msi | head -1)
          signed=$(ls signed-msi/*.msi | head -1)
          cp "$signed" "$msi"
          rm -f "${msi}.sig"
          pnpm exec tauri signer sign "$msi"

      # ── Subir artefactos finales (ambas plataformas) ──────────────────────
      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Listar artefactos descargados
        run: find artifacts -type f | sort

      - name: Generar latest.json
        run: |
          python3 - << 'EOF'
          import json, os, glob
          from datetime import datetime, timezone

          version = os.environ['GITHUB_REF_NAME'].lstrip('v')
          repo_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
          now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          platforms = {}

          for deb in glob.glob('artifacts/**/*.deb', recursive=True):
              sig_path = deb + '.sig'
              if os.path.exists(sig_path):
                  # Clave genérica: fallback para cualquier instalación Linux que no
                  # matchee una clave más específica (ej. rpm, sin AppImage detectado).
                  platforms['linux-x86_64'] = {
                      'signature': open(sig_path).read().strip(),
                      'url': f"{repo_url}/releases/download/v{version}/{os.path.basename(deb)}"
                  }

          for appimage in glob.glob('artifacts/**/*.AppImage', recursive=True):
              sig_path = appimage + '.sig'
              if os.path.exists(sig_path):
                  # El updater prueba "linux-x86_64-{bundle_type}" antes que la clave
                  # genérica (bundle_type se detecta en runtime vía patchelf), así que
                  # las apps corriendo como AppImage reciben este asset en vez del .deb.
                  platforms['linux-x86_64-appimage'] = {
                      'signature': open(sig_path).read().strip(),
                      'url': f"{repo_url}/releases/download/v{version}/{os.path.basename(appimage)}"
                  }

          for msi in glob.glob('artifacts/**/*.msi', recursive=True):
              sig_path = msi + '.sig'
              if os.path.exists(sig_path):
                  platforms['windows-x86_64'] = {
                      'signature': open(sig_path).read().strip(),
                      'url': f"{repo_url}/releases/download/v{version}/{os.path.basename(msi)}"
                  }

          manifest = {
              'version': f'v{version}',
              'notes': f'Release v{version}',
              'pub_date': now,
              'platforms': platforms
          }
          with open('latest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          EOF

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.deb.sig
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.AppImage.sig
            artifacts/**/*.msi
            artifacts/**/*.msi.sig
            latest.json
          token: ${{ secrets.GITHUB_TOKEN }}
