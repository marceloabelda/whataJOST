name: Release

# Se dispara cuando se pushea un tag v* (ej: v1.1.54)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar dependencias del sistema (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: pnpm install

      - name: Build
        run: pnpm exec tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Listar artefactos descargados
        run: find artifacts -type f | sort

      - name: Generar latest.json
        run: |
          python3 - << 'EOF'
          import json, os, glob
          from datetime import datetime, timezone

          version = os.environ['GITHUB_REF_NAME'].lstrip('v')
          repo_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
          now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          platforms = {}

          for deb in glob.glob('artifacts/**/*.deb', recursive=True):
              sig_path = deb + '.sig'
              if os.path.exists(sig_path):
                  platforms['linux-x86_64'] = {
                      'signature': open(sig_path).read().strip(),
                      'url': f"{repo_url}/releases/download/v{version}/{os.path.basename(deb)}"
                  }

          for msi in glob.glob('artifacts/**/*.msi', recursive=True):
              sig_path = msi + '.sig'
              if os.path.exists(sig_path):
                  platforms['windows-x86_64'] = {
                      'signature': open(sig_path).read().strip(),
                      'url': f"{repo_url}/releases/download/v{version}/{os.path.basename(msi)}"
                  }

          manifest = {
              'version': f'v{version}',
              'notes': f'Release v{version}',
              'pub_date': now,
              'platforms': platforms
          }
          with open('latest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          EOF

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.deb.sig
            artifacts/**/*.rpm
            artifacts/**/*.msi
            artifacts/**/*.msi.sig
            latest.json
          token: ${{ secrets.GITHUB_TOKEN }}
