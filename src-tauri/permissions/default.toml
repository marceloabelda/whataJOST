[[permission]]
identifier = "allow-whatsapp-ipc"
description = "Permite todos los comandos IPC usados desde la ventana de WhatsApp Web"
commands.allow = [
  "save_file_begin",
  "save_file_chunk",
  "save_file_abort",
  "save_file",
  "read_clipboard_image",
  "read_file_for_drop",
  "update_unread_count",
  "show_notification",
  "close_notification",
  "open_whatsapp",
  "log_js",
  "get_logs",
  "clear_logs",
  "open_logs",
  "get_resource_usage",
]
