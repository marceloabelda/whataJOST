[default]
description = "Permisos por defecto para comandos de la app principal (ventana local)"
permissions = ["allow-whatsapp-ipc"]

[[permission]]
identifier = "allow-whatsapp-ipc"
description = "Permite todos los comandos IPC usados desde la ventana de WhatsApp Web"
commands.allow = [
  "save_file",
  "read_clipboard_image",
  "read_file_for_drop",
  "update_unread_count",
  "show_notification",
  "close_notification",
  "open_whatsapp",
  "log_js",
  "get_logs",
  "clear_logs",
  "open_logs",
  "get_uptime_kuma_config",
  "save_uptime_kuma_config",
  "get_zabbix_config",
  "save_zabbix_config",
  "get_monitoring_status",
]
