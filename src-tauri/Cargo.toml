[package]
name = "whatajost"
version = "1.1.43"
description = "WhatsApp Web wrapper with tauri"
authors = ["jude7733"]
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/jude7733/whatauri"

[lib]
name = "whatajost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
mime_guess = "2"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
