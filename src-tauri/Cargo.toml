[package]
name = "whatajost"
version = "1.1.3"
description = "WhatsApp Web wrapper with tauri"
authors = ["jude7733"]
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/jude7733/whatauri"

[lib]
name = "whatajost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
