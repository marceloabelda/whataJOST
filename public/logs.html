<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #1a1f24;
      color: #e9edef;
      font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      font-size: 13px;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #14181c;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #00a884;
      letter-spacing: 0.3px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    button {
      background: #252d34;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e9edef;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: background 0.15s;
    }

    button:hover { background: #333c44; }
    button:active { background: #1e2428; }

    .log-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .log-entry {
      display: flex;
      gap: 10px;
      padding: 3px 16px;
      line-height: 1.5;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    }

    .log-entry:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .log-time {
      color: #54636e;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .log-level {
      flex-shrink: 0;
      width: 48px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      padding: 0 4px;
      text-transform: uppercase;
    }

    .log-level.info  { color: #00a884; }
    .log-level.warn  { color: #e5a83e; }
    .log-level.error { color: #f15c5c; }

    .log-msg {
      color: #c4cdd4;
      word-break: break-all;
    }

    .tabs {
      display: flex;
      gap: 4px;
    }

    .tab {
      background: transparent;
      border-color: transparent;
      color: #8696a0;
    }

    .tab.active {
      background: #252d34;
      border-color: rgba(255, 255, 255, 0.08);
      color: #e9edef;
    }

    .panel { flex: 1; min-height: 0; }
    .panel[hidden] { display: none; }

    .resources {
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: #14181c;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .card-title { color: #8696a0; font-size: 12px; }
    .card-value { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .card-sub { color: #54636e; font-size: 11px; margin-left: 8px; font-weight: 400; }

    .chart { width: 100%; height: 110px; display: block; }

    .proc-table { width: 100%; border-collapse: collapse; }
    .proc-table th {
      text-align: left;
      color: #54636e;
      font-weight: 400;
      font-size: 11px;
      padding: 0 0 4px;
    }
    .proc-table td { padding: 2px 0; color: #c4cdd4; font-variant-numeric: tabular-nums; }
    .proc-table .num { text-align: right; }

    .note { color: #54636e; font-size: 11px; line-height: 1.5; }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #54636e;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>WhataJOST</h1>
      <div class="tabs">
        <button class="tab active" data-tab="logs">Logs</button>
        <button class="tab" data-tab="resources">Recursos</button>
      </div>
      <div class="header-actions">
        <button id="clear-btn">Limpiar</button>
      </div>
    </div>
    <div class="panel log-list" id="log-list">
      <div class="empty-state">Sin eventos registrados</div>
    </div>
    <div class="panel resources" id="resources" hidden>
      <div class="card">
        <div class="card-head">
          <span class="card-title">CPU</span>
          <span class="card-value" id="cpu-value">—<span class="card-sub" id="cpu-sub"></span></span>
        </div>
        <canvas class="chart" id="cpu-chart"></canvas>
      </div>
      <div class="card">
        <div class="card-head">
          <span class="card-title">Memoria</span>
          <span class="card-value" id="mem-value">—<span class="card-sub" id="mem-sub"></span></span>
        </div>
        <canvas class="chart" id="mem-chart"></canvas>
      </div>
      <div class="card">
        <table class="proc-table">
          <thead><tr><th>Proceso</th><th class="num">PID</th><th class="num">Memoria</th></tr></thead>
          <tbody id="proc-body"></tbody>
        </table>
      </div>
      <div class="note" id="res-note"></div>
    </div>
  </div>

  <script>
    const logList = document.getElementById('log-list');
    const clearBtn = document.getElementById('clear-btn');

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function refreshLogs() {
      if (!window.__TAURI_INTERNALS__) {
        logList.innerHTML = '<div class="empty-state" style="color:#f15c5c">IPC no disponible (sin capability)</div>';
        return;
      }
      try {
        const logs = await window.__TAURI_INTERNALS__.invoke('get_logs');
        if (!logs.length) {
          logList.innerHTML = '<div class="empty-state">Sin eventos registrados</div>';
          return;
        }

        const wasAtBottom = logList.scrollTop + logList.clientHeight >= logList.scrollHeight - 4;

        logList.innerHTML = logs.map(log =>
          `<div class="log-entry">
            <span class="log-time">${escapeHtml(log.timestamp)}</span>
            <span class="log-level ${log.level}">${escapeHtml(log.level)}</span>
            <span class="log-msg">${escapeHtml(log.message)}</span>
          </div>`
        ).join('');

        if (wasAtBottom) {
          logList.scrollTop = logList.scrollHeight;
        }
      } catch(e) {
        logList.innerHTML = '<div class="empty-state" style="color:#f15c5c">Error IPC: ' + escapeHtml(String(e)) + '</div>';
      }
    }

    clearBtn.addEventListener('click', async () => {
      try {
        await window.__TAURI_INTERNALS__.invoke('clear_logs');
        refreshLogs();
      } catch(e) {}
    });

    refreshLogs();
    setInterval(refreshLogs, 2000);

    // ── Pestaña Recursos ────────────────────────────────────────────────
    // Muestrea cada 2 s solo mientras esta ventana está abierta (también con
    // la pestaña Logs visible, para que el historial ya esté armado al cambiar).
    const HISTORY = 150; // 5 minutos a 2 s
    const cpuHistory = [];
    const memHistory = [];
    let lastUsage = null;
    let activeTab = 'logs';

    const tabs = document.querySelectorAll('.tab');
    tabs.forEach(tab => tab.addEventListener('click', () => {
      activeTab = tab.dataset.tab;
      tabs.forEach(t => t.classList.toggle('active', t === tab));
      document.getElementById('log-list').hidden = activeTab !== 'logs';
      document.getElementById('resources').hidden = activeTab !== 'resources';
      clearBtn.style.visibility = activeTab === 'logs' ? 'visible' : 'hidden';
      renderResources();
    }));

    function formatMem(kb) {
      const mb = kb / 1024;
      return mb >= 1024 ? (mb / 1024).toFixed(2) + ' GB' : Math.round(mb) + ' MB';
    }

    function formatCpu(pct) {
      return pct.toFixed(pct < 10 ? 1 : 0) + ' %';
    }

    // Máximo "redondo" para el eje Y (1, 2, 5 × 10^n), con un piso mínimo.
    function niceMax(value, floor) {
      const v = Math.max(value, floor);
      const pow = Math.pow(10, Math.floor(Math.log10(v)));
      for (const m of [1, 2, 5, 10]) {
        if (m * pow >= v) return m * pow;
      }
      return 10 * pow;
    }

    function drawChart(canvas, values, color, floor, format) {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (!w || !h) return;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, w, h);

      const left = 56, top = 6, bottom = h - 4;
      const max = niceMax(values.length ? Math.max(...values) : 0, floor);
      ctx.font = '10px monospace';
      ctx.fillStyle = '#54636e';
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 2; i++) {
        const y = top + (bottom - top) * i / 2;
        ctx.beginPath();
        ctx.moveTo(left, Math.round(y) + 0.5);
        ctx.lineTo(w, Math.round(y) + 0.5);
        ctx.stroke();
        ctx.fillText(format(max * (2 - i) / 2), 0, y + 3);
      }
      if (values.length < 2) return;

      const step = (w - left) / (HISTORY - 1);
      const x0 = w - step * (values.length - 1);
      const yOf = v => bottom - (bottom - top) * (v / max);
      ctx.beginPath();
      values.forEach((v, i) => {
        const x = x0 + step * i;
        if (i === 0) ctx.moveTo(x, yOf(v)); else ctx.lineTo(x, yOf(v));
      });
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.lineTo(w, bottom);
      ctx.lineTo(x0, bottom);
      ctx.closePath();
      ctx.globalAlpha = 0.15;
      ctx.fillStyle = color;
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    function renderResources() {
      if (activeTab !== 'resources') return;
      const note = document.getElementById('res-note');
      if (lastUsage && !lastUsage.available) {
        document.getElementById('resources').innerHTML =
          '<div class="empty-state">Disponible solo en Linux</div>';
        return;
      }
      if (!lastUsage) return;

      const cpuNow = cpuHistory.length ? cpuHistory[cpuHistory.length - 1] : null;
      document.getElementById('cpu-value').firstChild.textContent = cpuNow === null ? '—' : formatCpu(cpuNow);
      document.getElementById('cpu-sub').textContent = cpuHistory.length ? 'máx ' + formatCpu(Math.max(...cpuHistory)) : '';
      document.getElementById('mem-value').firstChild.textContent = formatMem(lastUsage.memory_kb);
      document.getElementById('mem-sub').textContent = memHistory.length ? 'máx ' + formatMem(Math.max(...memHistory)) : '';

      drawChart(document.getElementById('cpu-chart'), cpuHistory, '#00a884', 5, formatCpu);
      drawChart(document.getElementById('mem-chart'), memHistory, '#53bdeb', 512 * 1024, formatMem);

      document.getElementById('proc-body').innerHTML = lastUsage.processes.map(p =>
        `<tr><td>${escapeHtml(p.name)}</td><td class="num">${p.pid}</td><td class="num">${formatMem(p.memory_kb)}</td></tr>`
      ).join('');

      note.textContent = 'Muestreo cada 2 s solo con esta ventana abierta (incluye esta ventana). ' +
        'CPU estilo top: 100 % = 1 núcleo (' + lastUsage.cpus + ' disponibles). ' +
        'Memoria: PSS (la memoria compartida se reparte entre procesos).';
    }

    async function sampleResources() {
      if (!window.__TAURI_INTERNALS__) return;
      try {
        lastUsage = await window.__TAURI_INTERNALS__.invoke('get_resource_usage');
        if (!lastUsage.available) { renderResources(); return; }
        if (lastUsage.cpu_percent !== null) {
          cpuHistory.push(lastUsage.cpu_percent);
          if (cpuHistory.length > HISTORY) cpuHistory.shift();
        }
        memHistory.push(lastUsage.memory_kb);
        if (memHistory.length > HISTORY) memHistory.shift();
        renderResources();
      } catch(e) {}
    }

    window.addEventListener('resize', renderResources);
    sampleResources();
    setInterval(sampleResources, 2000);
  </script>
</body>
</html>
