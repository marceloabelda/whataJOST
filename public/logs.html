<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #1a1f24;
      color: #e9edef;
      font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      font-size: 13px;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #14181c;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #00a884;
      letter-spacing: 0.3px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    button {
      background: #252d34;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e9edef;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: background 0.15s;
    }

    button:hover { background: #333c44; }
    button:active { background: #1e2428; }

    .log-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .log-entry {
      display: flex;
      gap: 10px;
      padding: 3px 16px;
      line-height: 1.5;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    }

    .log-entry:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .log-time {
      color: #54636e;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .log-level {
      flex-shrink: 0;
      width: 48px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      padding: 0 4px;
      text-transform: uppercase;
    }

    .log-level.info  { color: #00a884; }
    .log-level.warn  { color: #e5a83e; }
    .log-level.error { color: #f15c5c; }

    .log-msg {
      color: #c4cdd4;
      word-break: break-all;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #54636e;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Logs de WhataJOST</h1>
      <div class="header-actions">
        <button id="clear-btn">Limpiar</button>
      </div>
    </div>
    <div class="log-list" id="log-list">
      <div class="empty-state">Sin eventos registrados</div>
    </div>
  </div>

  <script>
    const logList = document.getElementById('log-list');
    const clearBtn = document.getElementById('clear-btn');

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function refreshLogs() {
      try {
        const logs = await window.__TAURI_INTERNALS__.invoke('get_logs');
        if (!logs.length) {
          logList.innerHTML = '<div class="empty-state">Sin eventos registrados</div>';
          return;
        }

        const wasAtBottom = logList.scrollTop + logList.clientHeight >= logList.scrollHeight - 4;

        logList.innerHTML = logs.map(log =>
          `<div class="log-entry">
            <span class="log-time">${escapeHtml(log.timestamp)}</span>
            <span class="log-level ${log.level}">${escapeHtml(log.level)}</span>
            <span class="log-msg">${escapeHtml(log.message)}</span>
          </div>`
        ).join('');

        if (wasAtBottom) {
          logList.scrollTop = logList.scrollHeight;
        }
      } catch(e) {
        console.warn('[whataJOST] log refresh failed:', e);
      }
    }

    clearBtn.addEventListener('click', async () => {
      try {
        await window.__TAURI_INTERNALS__.invoke('clear_logs');
        refreshLogs();
      } catch(e) {}
    });

    refreshLogs();
    setInterval(refreshLogs, 2000);
  </script>
</body>
</html>
