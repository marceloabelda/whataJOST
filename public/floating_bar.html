<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>WhataJOST</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    #bar {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 38px;
      padding: 0 14px;
      background: rgba(30, 30, 46, 0.88);
      backdrop-filter: blur(8px);
      border-radius: 19px;
      border: 1px solid rgba(137, 180, 250, 0.18);
      cursor: grab;
    }
    #bar.dragging { cursor: grabbing; }

    .section {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .section-label {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: #6c7086;
      letter-spacing: .3px;
      white-space: nowrap;
    }
    .dots { display: flex; gap: 4px; align-items: center; }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background .3s;
    }
    .dot-ok        { background: #a6e3a1; }
    .dot-down      { background: #f38ba8; }
    .dot-warn      { background: #f9e2af; }
    .dot-offline   { background: #6c7086; }
    .dot-uncfg     { background: #313244; border: 1px solid #45475a; }

    .divider {
      width: 1px; height: 20px;
      background: rgba(137, 180, 250, 0.18);
      flex-shrink: 0;
    }

    .status-text {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px;
      color: #a6adc8;
      white-space: nowrap;
    }
    .status-text.ok { color: #a6e3a1; }
    .status-text.err { color: #f38ba8; }
    .status-text.warn { color: #f9e2af; }
    .status-text.off { color: #6c7086; }
  </style>
</head>
<body>
  <div id="bar">
    <div class="section" id="uk-section">
      <span class="section-label">UK</span>
      <div class="dots" id="uk-dots"></div>
      <span class="status-text off" id="uk-text">—</span>
    </div>
    <div class="divider"></div>
    <div class="section" id="zbx-section">
      <span class="section-label">ZBX</span>
      <div class="dots" id="zbx-dots"></div>
      <span class="status-text off" id="zbx-text">—</span>
    </div>
  </div>

  <script>
    const ipc = window.__TAURI_INTERNALS__;

    // ── Drag manual (data-tauri-drag-region tiene problemas en Wayland) ──
    let drag = null;
    document.getElementById('bar').addEventListener('mousedown', async (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      try {
        const pos = await ipc.invoke('plugin:window|outer_position');
        drag = { startMX: e.screenX, startMY: e.screenY, winX: pos.x, winY: pos.y };
        document.getElementById('bar').classList.add('dragging');
      } catch(_) {}
    });
    document.addEventListener('mousemove', (e) => {
      if (!drag) return;
      const x = drag.winX + e.screenX - drag.startMX;
      const y = drag.winY + e.screenY - drag.startMY;
      ipc.invoke('plugin:window|set_position', { position: { Physical: { x, y } } }).catch(() => {});
    });
    document.addEventListener('mouseup', () => {
      drag = null;
      document.getElementById('bar').classList.remove('dragging');
    });

    function dot(cls, title) {
      const d = document.createElement('div');
      d.className = 'dot ' + cls;
      d.title = title;
      return d;
    }

    function renderStatus(status) {
      const ukDots  = document.getElementById('uk-dots');
      const ukText  = document.getElementById('uk-text');
      const zbxDots = document.getElementById('zbx-dots');
      const zbxText = document.getElementById('zbx-text');

      // ── Uptime Kuma ──
      ukDots.innerHTML = '';
      if (!status.uk_configured) {
        ukText.textContent = 'sin config';
        ukText.className = 'status-text off';
      } else if (!status.uk_reachable) {
        ukDots.appendChild(dot('dot-offline', 'Sin conexión'));
        ukText.textContent = 'offline';
        ukText.className = 'status-text off';
      } else {
        const down = status.uk_monitors.filter(m => !m.up);
        const up   = status.uk_monitors.filter(m =>  m.up);
        if (down.length === 0) {
          ukDots.appendChild(dot('dot-ok', `${up.length}/${status.uk_monitors.length} OK`));
          ukText.textContent = `${up.length}/${status.uk_monitors.length}`;
          ukText.className = 'status-text ok';
        } else {
          down.slice(0, 5).forEach(m => ukDots.appendChild(dot('dot-down', m.name)));
          ukText.textContent = `${down.length} caído${down.length > 1 ? 's' : ''}`;
          ukText.className = 'status-text err';
        }
      }

      // ── Zabbix ──
      zbxDots.innerHTML = '';
      if (!status.zbx_configured) {
        zbxText.textContent = 'sin config';
        zbxText.className = 'status-text off';
      } else if (!status.zbx_reachable) {
        zbxDots.appendChild(dot('dot-offline', 'Sin conexión'));
        zbxText.textContent = 'offline';
        zbxText.className = 'status-text off';
      } else if (status.zbx_problems.length === 0) {
        zbxDots.appendChild(dot('dot-ok', 'Todo OK'));
        zbxText.textContent = 'OK';
        zbxText.className = 'status-text ok';
      } else {
        const n = status.zbx_problems.length;
        const sevColor = (sev) => {
          if (sev >= 4) return 'dot-down';
          if (sev === 3) return 'dot-warn';
          return 'dot-offline';
        };
        status.zbx_problems.slice(0, 5).forEach(p =>
          zbxDots.appendChild(dot(sevColor(p.severity), `[${p.severity_label}] ${p.name}`))
        );
        zbxText.textContent = `${n} problema${n > 1 ? 's' : ''}`;
        zbxText.className = 'status-text err';
      }
    }

    function poll() {
      ipc.invoke('get_monitoring_status')
        .then(renderStatus)
        .catch(() => {});
    }

    poll();
    setInterval(poll, 5000);
  </script>
</body>
</html>
