<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>WhataJOST</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    #bar {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 38px;
      padding: 0 14px;
      background: rgba(30, 30, 46, 0.88);
      border-radius: 19px;
      border: 1px solid rgba(137, 180, 250, 0.18);
      cursor: grab;
    }
    #bar:active { cursor: grabbing; }

    .section {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .section-label {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: #6c7086;
      letter-spacing: .3px;
      white-space: nowrap;
    }
    .dots { display: flex; gap: 4px; align-items: center; }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background .3s;
    }
    .dot-ok        { background: #a6e3a1; }
    .dot-down      { background: #f38ba8; }
    .dot-warn      { background: #f9e2af; }
    .dot-offline   { background: #6c7086; }
    .dot-uncfg     { background: #313244; border: 1px solid #45475a; }

    .divider {
      width: 1px; height: 20px;
      background: rgba(137, 180, 250, 0.18);
      flex-shrink: 0;
    }

    .status-text {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px;
      color: #a6adc8;
      white-space: nowrap;
    }
    .status-text.ok { color: #a6e3a1; }
    .status-text.err { color: #f38ba8; }
    .status-text.warn { color: #f9e2af; }
    .status-text.off { color: #6c7086; }
    .section-label.clickable {
      cursor: pointer;
      color: #89b4fa;
      text-decoration: underline dotted;
    }
    .section-label.clickable:hover { color: #cdd6f4; }
  </style>
</head>
<body>
  <div id="bar" data-tauri-drag-region>
    <div class="section" id="uk-section">
      <span class="section-label" id="uk-label">UK</span>
      <div class="dots" id="uk-dots"></div>
      <span class="status-text off" id="uk-text">cargando</span>
    </div>
    <div class="divider"></div>
    <div class="section" id="zbx-section">
      <span class="section-label" id="zbx-label">ZBX</span>
      <div class="dots" id="zbx-dots"></div>
      <span class="status-text off" id="zbx-text">cargando</span>
    </div>
  </div>

  <script>
    (function() {
      var ipc = window.__TAURI_INTERNALS__;

      if (!ipc || typeof ipc.invoke !== 'function') {
        document.getElementById('uk-text').textContent = 'IPC no disponible';
        document.getElementById('zbx-text').textContent = 'IPC no disponible';
        return;
      }

      function dot(cls, title) {
        var d = document.createElement('div');
        d.className = 'dot ' + cls;
        if (title) d.title = title;
        return d;
      }

      function openUrl(url) {
        if (url) ipc.invoke('open_monitoring_url', { url: url });
      }

      function setLabelClickable(id, url) {
        var el = document.getElementById(id);
        if (url) {
          el.classList.add('clickable');
          el.onclick = function() { openUrl(url); };
        } else {
          el.classList.remove('clickable');
          el.onclick = null;
        }
      }

      function renderStatus(status) {
        var ukDots  = document.getElementById('uk-dots');
        var ukText  = document.getElementById('uk-text');
        var zbxDots = document.getElementById('zbx-dots');
        var zbxText = document.getElementById('zbx-text');

        setLabelClickable('uk-label', status.uk_url);
        setLabelClickable('zbx-label', status.zbx_url);

        // ── Uptime Kuma ──
        ukDots.innerHTML = '';
        if (!status.uk_configured) {
          ukText.textContent = 'sin config';
          ukText.className = 'status-text off';
        } else if (!status.uk_reachable) {
          ukDots.appendChild(dot('dot-offline', 'Sin conexion'));
          ukText.textContent = 'offline';
          ukText.className = 'status-text off';
        } else {
          var down = status.uk_monitors.filter(function(m) { return !m.up; });
          var up   = status.uk_monitors.filter(function(m) { return  m.up; });
          if (down.length === 0) {
            ukDots.appendChild(dot('dot-ok', up.length + '/' + status.uk_monitors.length + ' OK'));
            ukText.textContent = up.length + '/' + status.uk_monitors.length;
            ukText.className = 'status-text ok';
          } else {
            down.slice(0, 5).forEach(function(m) { ukDots.appendChild(dot('dot-down', m.name)); });
            ukText.textContent = down.length + ' caido' + (down.length > 1 ? 's' : '');
            ukText.className = 'status-text err';
          }
        }

        // ── Zabbix ──
        zbxDots.innerHTML = '';
        if (!status.zbx_configured) {
          zbxText.textContent = 'sin config';
          zbxText.className = 'status-text off';
        } else if (!status.zbx_reachable) {
          zbxDots.appendChild(dot('dot-offline', 'Sin conexion'));
          zbxText.textContent = 'offline';
          zbxText.className = 'status-text off';
        } else if (status.zbx_problems.length === 0) {
          zbxDots.appendChild(dot('dot-ok', 'Todo OK'));
          zbxText.textContent = 'OK';
          zbxText.className = 'status-text ok';
        } else {
          var n = status.zbx_problems.length;
          status.zbx_problems.slice(0, 5).forEach(function(p) {
            var cls = p.severity >= 4 ? 'dot-down' : (p.severity === 3 ? 'dot-warn' : 'dot-offline');
            zbxDots.appendChild(dot(cls, '[' + p.severity_label + '] ' + p.name));
          });
          zbxText.textContent = n + ' problema' + (n > 1 ? 's' : '');
          zbxText.className = 'status-text err';
        }
      }

      function poll() {
        ipc.invoke('get_monitoring_status').then(renderStatus).catch(function(e) {
          document.getElementById('uk-text').textContent = 'error IPC';
          document.getElementById('zbx-text').textContent = 'error IPC';
        });
      }

      poll();
      setInterval(poll, 5000);
    })();
  </script>
</body>
</html>
