<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Zabbix — WhataJOST</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e1e2e; color: #cdd6f4;
      padding: 22px 24px; font-size: 14px;
    }
    h2 { font-size: 15px; font-weight: 600; margin-bottom: 18px; color: #89b4fa; }
    label { display: block; font-size: 11px; color: #a6adc8; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .4px; }
    input[type="url"], input[type="password"] {
      display: block; width: 100%;
      padding: 8px 10px; margin-bottom: 14px;
      background: #313244; border: 1px solid #45475a; border-radius: 6px;
      color: #cdd6f4; font-size: 13px; outline: none;
    }
    input:focus { border-color: #89b4fa; }
    .sev-group { margin-bottom: 14px; }
    .sev-label { font-size: 11px; color: #a6adc8; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px; }
    .sev-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .sev-chip {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 20px; cursor: pointer;
      border: 1px solid #45475a; background: #313244;
      font-size: 12px; color: #a6adc8; user-select: none; transition: all .15s;
    }
    .sev-chip input { display: none; }
    .sev-chip.checked { border-color: currentColor; }
    .sev-chip[data-sev="0"].checked { color: #a6adc8; background: #3a3a52; }
    .sev-chip[data-sev="1"].checked { color: #89b4fa; background: #1e3a5a; border-color: #89b4fa; }
    .sev-chip[data-sev="2"].checked { color: #a6e3a1; background: #1e3a2e; border-color: #a6e3a1; }
    .sev-chip[data-sev="3"].checked { color: #f9e2af; background: #3a3018; border-color: #f9e2af; }
    .sev-chip[data-sev="4"].checked { color: #fab387; background: #3a2010; border-color: #fab387; }
    .sev-chip[data-sev="5"].checked { color: #f38ba8; background: #3a1018; border-color: #f38ba8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .actions { display: flex; gap: 8px; margin-top: 4px; }
    button {
      padding: 8px 18px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 13px; font-weight: 600;
    }
    .btn-save  { background: #89b4fa; color: #1e1e2e; }
    .btn-save:hover { background: #74c7ec; }
    .btn-clear { background: #313244; color: #a6adc8; }
    .btn-clear:hover { background: #45475a; }
    .note { margin-top: 14px; font-size: 11px; color: #6c7086; line-height: 1.6; }
    #status { font-size: 12px; color: #a6e3a1; margin-top: 10px; min-height: 18px; }
    #status.error { color: #f38ba8; }
  </style>
</head>
<body>
  <h2>Zabbix</h2>
  <label>URL de la instancia</label>
  <input id="url" type="url" placeholder="https://zabbix.tudominio.com">
  <label>API Token</label>
  <input id="token" type="password" placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx">

  <div class="sev-group">
    <div class="sev-label">Mostrar alertas de severidad</div>
    <div class="sev-list" id="sev-list">
      <label class="sev-chip" data-sev="0"><input type="checkbox" value="0"><div class="dot"></div>No clasificado</label>
      <label class="sev-chip" data-sev="1"><input type="checkbox" value="1"><div class="dot"></div>Información</label>
      <label class="sev-chip" data-sev="2"><input type="checkbox" value="2"><div class="dot"></div>Advertencia</label>
      <label class="sev-chip" data-sev="3"><input type="checkbox" value="3"><div class="dot"></div>Promedio</label>
      <label class="sev-chip" data-sev="4"><input type="checkbox" value="4"><div class="dot"></div>Alto</label>
      <label class="sev-chip" data-sev="5"><input type="checkbox" value="5"><div class="dot"></div>Desastre</label>
    </div>
  </div>

  <div class="actions">
    <button class="btn-save" onclick="save()">Guardar</button>
    <button class="btn-clear" onclick="clear_()">Quitar</button>
  </div>
  <p class="note">
    API Token: Zabbix → Administración → Tokens de API (v5.4+)<br>
    La app consulta <code>/api_jsonrpc.php</code> cada 30 segundos.
  </p>
  <div id="status"></div>

  <script>
    (function() {
      var elUrl   = document.getElementById('url');
      var elToken = document.getElementById('token');
      var elSt    = document.getElementById('status');
      var ipc = window.__TAURI_INTERNALS__;

      if (!ipc) {
        elSt.textContent = 'IPC no disponible. Revisá los permisos de la ventana.';
        elSt.className = 'error';
        return;
      }

      function setStatus(msg, error) {
        elSt.textContent = msg;
        elSt.className = error ? 'error' : '';
      }

      // Severity chip toggle
      document.querySelectorAll('.sev-chip').forEach(function(chip) {
        var cb = chip.querySelector('input');
        cb.addEventListener('change', function() {
          chip.classList.toggle('checked', cb.checked);
        });
      });

      function getSeverities() {
        return Array.from(document.querySelectorAll('.sev-chip input:checked'))
          .map(function(cb) { return parseInt(cb.value); });
      }

      // Cargar config existente
      try {
        ipc.invoke('get_zabbix_config').then(function(cfg) {
          elUrl.value   = cfg.url       || '';
          elToken.value = cfg.api_token || '';
          var sevs = cfg.severities || [4, 5];
          document.querySelectorAll('.sev-chip input').forEach(function(cb) {
            var checked = sevs.indexOf(parseInt(cb.value)) !== -1;
            cb.checked = checked;
            cb.closest('.sev-chip').classList.toggle('checked', checked);
          });
        }).catch(function(e) {
          setStatus('Error al cargar config: ' + (e && (e.message || String(e))), true);
        });
      } catch(e) {
        setStatus('Error sync al cargar: ' + (e && e.message), true);
      }

      window.save = function() {
        var url   = elUrl.value.trim();
        var token = elToken.value.trim();
        if (!url)   { setStatus('Ingresá una URL válida.', true); return; }
        if (!token) { setStatus('Ingresá un API Token.', true);   return; }
        var severities = getSeverities();
        if (!severities.length) { setStatus('Seleccioná al menos una severidad.', true); return; }
        setStatus('Guardando...');
        try {
          var p = ipc.invoke('save_zabbix_config', { url: url, api_token: token, severities: severities });
          if (!p || typeof p.then !== 'function') {
            setStatus('Error: invoke no devolvió Promise. Tipo: ' + typeof p, true);
            return;
          }
          p.then(function() {
            setStatus('Guardado. Podés cerrar esta ventana.');
          }).catch(function(e) {
            setStatus('Error: ' + (e && (e.message || String(e))), true);
          });
        } catch(e) {
          setStatus('Error sync al guardar: ' + (e && e.message), true);
        }
      };

      window.clear_ = function() {
        setStatus('Quitando config...');
        try {
          var p = ipc.invoke('save_zabbix_config', { url: '', api_token: '', severities: [] });
          if (!p || typeof p.then !== 'function') {
            setStatus('Error: invoke no devolvió Promise. Tipo: ' + typeof p, true);
            return;
          }
          p.then(function() {
            setStatus('Configuración quitada. Podés cerrar esta ventana.');
          }).catch(function(e) {
            setStatus('Error: ' + (e && (e.message || String(e))), true);
          });
        } catch(e) {
          setStatus('Error sync al quitar: ' + (e && e.message), true);
        }
      };
    })();
  </script>
</body>
</html>
