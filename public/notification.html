<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1e2428;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 14px 14px;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
      height: 100%;
      position: relative;
      overflow: hidden;
      user-select: none;
      transition: background 0.1s;
    }

    .card:hover { background: #252d34; }
    .card:active { background: #1a2025; }

    .avatar {
      width: 44px;
      height: 44px;
      background: #00a884;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 20px;
    }

    .content {
      flex: 1;
      min-width: 0;
    }

    .app-label {
      color: #00a884;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-bottom: 3px;
      text-transform: uppercase;
    }

    .contact {
      color: #e9edef;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .message {
      color: #8696a0;
      font-size: 13px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .close-btn {
      position: absolute;
      top: 8px;
      right: 10px;
      color: #8696a0;
      font-size: 14px;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.1s, color 0.1s;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #e9edef;
    }

    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: #00a884;
      border-radius: 0 0 0 12px;
      animation: progress 5s linear forwards;
    }

    @keyframes progress {
      from { width: 100%; }
      to   { width: 0%; }
    }

    .card.fade-out {
      animation: fadeOut 0.25s ease forwards;
    }

    @keyframes fadeOut {
      to { opacity: 0; transform: translateX(20px); }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="avatar">💬</div>
    <div class="content">
      <div class="app-label">WhatsApp</div>
      <div class="contact" id="contact">Cargando...</div>
      <div class="message" id="message"></div>
    </div>
    <div class="close-btn" id="close-btn">✕</div>
    <div class="progress-bar"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const contactName = params.get('t') || 'WhatsApp';
    const messageText = params.get('b') || 'Nuevo mensaje';

    document.getElementById('contact').textContent = contactName;
    document.getElementById('message').textContent = messageText;

    function dismiss() {
      const card = document.getElementById('card');
      card.classList.add('fade-out');
      setTimeout(() => {
        window.__TAURI_INTERNALS__.invoke('close_notification');
      }, 240);
    }

    document.getElementById('card').addEventListener('click', (e) => {
      if (e.target.id === 'close-btn' || e.target.closest('#close-btn')) return;
      window.__TAURI_INTERNALS__.invoke('open_whatsapp');
    });

    document.getElementById('close-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      dismiss();
    });

    setTimeout(dismiss, 5000);
  </script>
</body>
</html>
